# シミュレーター向けのビルドとテスト。
# ビルドとは、書いたコードを、動くアプリの形に組み立てること。
# シミュレーターとは、Mac の中で動く仮想の iPhone。
#
# macOS は時間でお金がかかる。Free プランの無料枠は月 2,000 分。
# macOS は 1 分あたり約 $0.062。ジョブは分単位で切り上げる（1 分 22 秒は 2 分と数える）。
# 「macOS は 10 倍消費」という記載、および無料枠をどれだけ消費するか（倍率）は、公式では未確認。2,000 分がそのまま macOS の分数とは限らない。
# PR ではビルド+全テスト+スクリーンショット（今までと同じ）、main への push ではビルドだけ。
# .md や docs だけの変更では動かない。
# paths-ignore は、変更されたファイルがすべて無視対象のときだけ動かさない。ほかのファイルも一緒に変わっているときは動く。
# GitHub の予算アラート（Budgets and alerts）を設定しておくと安心（Jun 向けのメモ）。
#
# 同じ名前のシミュレーターが複数あるときは、一覧の最初を選ぶ。ランナーイメージの更新で、選ばれるOSが変わることがある。
# iPhone 17 は iOS 26.2 / 26.4 / 26.5 など複数ある。
# OS を固定したい場合は、あとで OS= を指定する（今は固定しない）。
name: CI

# Xcode の版はここだけに書く。下の手順は、この値から場所を作る。
env:
  XCODE_VERSION: "26.6"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    # ドキュメントだけの変更では動かさない。
    # paths-ignore は、変更されたファイルがすべて無視対象のときだけ動かさない。
    # ほかのファイルも一緒に変わっているときは動く。
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.md"
  push:
    branches:
      - main
    # ドキュメントだけの変更では動かさない。
    # paths-ignore は、変更されたファイルがすべて無視対象のときだけ動かさない。
    # ほかのファイルも一緒に変わっているときは動く。
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "**/*.md"

# PR のときだけ、同じブランチの古い実行を止める。
# main への push では、実行中の実行は止めない（ただし、待っている実行は新しい実行に置き換わることがある）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: シミュレーターでビルドとテスト
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # actions/checkout の安定版。
      # 2026-10-27 に GitHub の Releases を確認し、最新の安定版は v7.0.1（2026-07-20 公開）。
      - name: コードを取得
        uses: actions/checkout@v7.0.1

      # App Group ID（アプリ本体とウィジェットが共有するフォルダの名前）が、
      # Sources/Core/Storage/AppGroup.swift と project.yml で同じかを確認する。
      # 食い違ったら失敗にする。XcodeGen（プロジェクトを作る道具）より前に置く。
      # Xcode は使わない。macOS の時間はほとんど使わない。
      - name: App Group ID の一致を確認
        run: |
          set -e
          set -o pipefail
          swift_ids="$(grep -o 'group\.com\.[A-Za-z0-9.]*' Sources/Core/Storage/AppGroup.swift | sort -u || true)"
          yml_ids="$(grep -o 'group\.com\.[A-Za-z0-9.]*' project.yml | sort -u || true)"
          echo "AppGroup.swift:"
          printf '%s\n' "${swift_ids}"
          echo "project.yml:"
          printf '%s\n' "${yml_ids}"
          if [ -z "${swift_ids}" ] || [ -z "${yml_ids}" ]; then
            echo "error: App Group ID を取り出せませんでした"
            exit 1
          fi
          swift_count="$(printf '%s\n' "${swift_ids}" | grep -c . || true)"
          yml_count="$(printf '%s\n' "${yml_ids}" | grep -c . || true)"
          if [ "${swift_count}" -ne 1 ] || [ "${yml_count}" -ne 1 ]; then
            echo "error: App Group ID が1つに定まりません"
            exit 1
          fi
          if [ "${swift_ids}" != "${yml_ids}" ]; then
            echo "error: App Group ID が一致しません（AppGroup.swift: ${swift_ids} / project.yml: ${yml_ids}）"
            exit 1
          fi

      # 要確認: sudo xcode-select -s で Xcode を選ぶ方法は、
      # GitHub の公式ドキュメント（docs.github.com）では確認できていない。
      # 選んだあと xcodebuild -version を表示し、26.6 でなければ失敗にする。
      - name: Xcode を 26.6 に固定
        run: |
          set -e
          set -o pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          echo "xcode-select -p:"
          xcode-select -p
          echo "xcodebuild -version:"
          xcodebuild -version | tee /tmp/xcode-version.txt
          version_line="$(head -n 1 /tmp/xcode-version.txt)"
          if [ "$version_line" != "Xcode ${XCODE_VERSION}" ]; then
            echo "error: Xcode ${XCODE_VERSION} ではありません: ${version_line}"
            exit 1
          fi

      - name: XcodeGen でプロジェクトを作る
        run: |
          set -e
          set -o pipefail
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      # 機種名は固定しない。利用できる iPhone の一覧から UDID（そのシミュレーターの識別子）を取る。
      # 名前がちょうど「iPhone 17」のものがあればそれを使う。なければ最初の iPhone。
      # 一覧から取れないときだけ、予備として name=iPhone 17 を使う（この予備は未確認）。
      - name: シミュレーターを選ぶ
        run: |
          set -e
          set -o pipefail
          echo "=== xcrun simctl list ==="
          xcrun simctl list
          echo "=== xcrun simctl list devices available ==="
          available="$(xcrun simctl list devices available)"
          printf '%s\n' "$available"

          preferred_udid=""
          fallback_udid=""
          fallback_name=""

          while IFS= read -r line; do
            case "$line" in
              *"(unavailable)"*)
                continue
                ;;
            esac
            if [[ "$line" =~ ^[[:space:]]*(.+)[[:space:]]\(([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12})\) ]]; then
              name="${BASH_REMATCH[1]}"
              id="${BASH_REMATCH[2]}"
              name="${name#"${name%%[![:space:]]*}"}"
              name="${name%"${name##*[![:space:]]}"}"
              case "$name" in
                iPhone*)
                  ;;
                *)
                  continue
                  ;;
              esac
              if [ -z "$fallback_udid" ]; then
                fallback_udid="$id"
                fallback_name="$name"
              fi
              if [ "$name" = "iPhone 17" ] && [ -z "$preferred_udid" ]; then
                preferred_udid="$id"
              fi
            fi
          done < <(printf '%s\n' "$available")

          if [ -n "$preferred_udid" ]; then
            destination="platform=iOS Simulator,id=${preferred_udid}"
            echo "選んだシミュレーター: iPhone 17 (${preferred_udid})"
            echo "SIMULATOR_UDID=${preferred_udid}" >> "$GITHUB_ENV"
          elif [ -n "$fallback_udid" ]; then
            destination="platform=iOS Simulator,id=${fallback_udid}"
            echo "iPhone 17 は見つかりませんでした。一覧の最初の iPhone を使います: ${fallback_name} (${fallback_udid})"
            echo "SIMULATOR_UDID=${fallback_udid}" >> "$GITHUB_ENV"
          else
            destination="platform=iOS Simulator,name=iPhone 17"
            echo "注意: UDID を取り出せませんでした。予備の destination を使います（未確認）: ${destination}"
          fi

          echo "DESTINATION=${destination}" >> "$GITHUB_ENV"
          echo "destination: ${destination}"

      # 署名（アプリを作った人を証明する手続き）の特別なフラグは付けない。
      # シミュレーター向けでは要らないはずだが、未確認。
      - name: ビルド
        run: |
          set -e
          set -o pipefail
          if [ -z "${DESTINATION}" ]; then
            echo "error: DESTINATION が空です"
            exit 1
          fi
          xcodebuild build \
            -project EasyJournal.xcodeproj \
            -scheme EasyJournal \
            -destination "${DESTINATION}" \
            -derivedDataPath DerivedData

      # 単体テストと UI テストを、この1回の xcodebuild test でまとめて実行する。
      # 結果は TestResults.xcresult（テスト結果のまとまり）に入る。
      # UI テストで増える時間は、ここでは測れない（要確認）。
      # main への push では実行しない。PR のときだけテストする。
      - name: テスト
        if: github.event_name == 'pull_request'
        run: |
          set -e
          set -o pipefail
          if [ -z "${DESTINATION}" ]; then
            echo "error: DESTINATION が空です"
            exit 1
          fi
          xcodebuild test \
            -project EasyJournal.xcodeproj \
            -scheme EasyJournal \
            -destination "${DESTINATION}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult

      # actions/upload-artifact の安定版。
      # 2026-10-27 に GitHub の Releases を確認し、最新の安定版は v7.0.2（2026-10-07 公開）。
      # 失敗したときだけアップロードする。テストより前で失敗したときは、ファイルが無いことがある。
      # main への push ではテストしないので、この手順も動かさない。
      - name: 結果ファイルをアップロード
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: xcresult
          path: TestResults.xcresult
          retention-days: 7

      # テストの添付（画面写真）を .xcresult から取り出す。
      # 引数（--path、--output-path）は、Xcode 26.6 自身の --help（CIの実行 40608010831 のログ）で確認できた。
      # Apple公式のWebドキュメントでは確認できていない。
      # 変更に気づけるように、ヘルプは毎回ログに出す。
      # 失敗しても、あとの手順は続ける。
      # テストが失敗したときも続ける（画面写真が残っていることがあるため）。
      # 既存の「結果ファイルをアップロード」の条件を変えないよう、その後に置いている。
      # main への push ではテストしないので、この手順も動かさない。
      - name: スクリーンショットを取り出す
        id: export-screenshots
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          set -e
          set -o pipefail
          mkdir -p screenshots

          write_png_count() {
            # 終了時の処理の最後が成功すると、失敗した終了コードが消えることがある。元のコードを残す。
            status=$?
            png_count="$(find screenshots -type f -iname '*.png' 2>/dev/null | wc -l | tr -d '[:space:]' || true)"
            if [ -z "${png_count}" ]; then
              png_count="0"
            fi
            echo "取り出し直後の PNG の枚数: ${png_count}"
            if [ -n "${GITHUB_OUTPUT}" ]; then
              echo "png_count=${png_count}" >> "${GITHUB_OUTPUT}"
            fi
            if [ "${status}" -ne 0 ]; then
              echo "::warning::スクリーンショットの取り出しに失敗しました"
            fi
            exit "${status}"
          }
          trap write_png_count EXIT

          echo "=== xcrun xcresulttool export attachments --help ==="
          echo "引数（--path、--output-path）は、Xcode 26.6 自身の --help（CIの実行 40608010831）で確認済みです。"
          echo "Apple公式のWebドキュメントでは確認できていません。変更に気づけるように、ヘルプは毎回出します。"
          xcrun xcresulttool export attachments --help || true

          result_path="${GITHUB_WORKSPACE}/TestResults.xcresult"
          output_path="${GITHUB_WORKSPACE}/screenshots"
          if [ ! -d "${result_path}" ]; then
            echo "TestResults.xcresult がありません。取り出しはできません。"
            exit 1
          fi

          echo "=== export attachments を試す ==="
          echo "--path と --output-path は、Xcode 26.6 の --help（CIの実行 40608010831）で確認済みです。Apple公式のWebドキュメントでは未確認です。"
          echo "manifest.json の形は未確認なので、ファイル名の付け替えはしません。出てきたファイルをそのまま保存します。"
          xcrun xcresulttool export attachments \
            --path "${result_path}" \
            --output-path "${output_path}"

          echo "=== screenshots の中身 ==="
          find screenshots -print

          echo "=== 参考: ワークスペース内の PNG と manifest.json（DerivedData は除く） ==="
          find . -path ./DerivedData -prune -o \( -iname '*.png' -o -name 'manifest.json' \) -print || true

      # 予備。screenshots に PNG が1枚も無いときだけ動く。
      # 要確認: simctl で起動して撮る手順は、ここでは試していない。動くかは未確認。
      # アプリのパスと Bundle ID は、ビルド結果と PlistBuddy から取る。べた書きしない。
      # この手順も未確認なので、失敗してもジョブ全体は止めない。PNG が無いことは、次のログに出す。
      # main への push ではテストしないので、この手順も動かさない。png_count の判定はそのまま残す。
      - name: 予備のスクリーンショット
        if: ${{ !cancelled() && (steps.export-screenshots.outputs.png_count == '0' || steps.export-screenshots.outputs.png_count == '') && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          set -e
          set -o pipefail
          mkdir -p screenshots

          if [ -z "${SIMULATOR_UDID}" ]; then
            echo "error: SIMULATOR_UDID が空です。予備の撮影はできません。"
            exit 1
          fi

          echo "=== ビルド結果からアプリを探す ==="
          if [ ! -d DerivedData ]; then
            echo "error: DerivedData がありません。アプリのパスを取り出せません。"
            exit 1
          fi
          app_path=""
          app_count=0
          while IFS= read -r app; do
            if [ -z "${app}" ]; then
              continue
            fi
            case "${app}" in
              *UITest*|*uitest*)
                echo "除外: ${app}"
                continue
                ;;
            esac
            case "${app}" in
              *"/Build/Products/"*iphonesimulator*)
                ;;
              *)
                echo "除外（ビルド成果物のシミュレーター向けではない）: ${app}"
                continue
                ;;
            esac
            echo "候補: ${app}"
            app_count=$((app_count + 1))
            app_path="${app}"
          done < <(find DerivedData -type d -name '*.app' | sort)

          if [ "${app_count}" -ne 1 ]; then
            echo "error: アプリの .app を1つに決められませんでした（${app_count} 件）。パスはべた書きしません。"
            exit 1
          fi

          echo "使うアプリ: ${app_path}"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Info.plist")"
          if [ -z "${bundle_id}" ]; then
            echo "error: Bundle ID を取り出せませんでした。"
            exit 1
          fi
          echo "Bundle ID（ビルド結果から）: ${bundle_id}"

          echo "=== シミュレーターを起動 ==="
          device_line="$(xcrun simctl list devices | grep "${SIMULATOR_UDID}" | head -n 1 || true)"
          echo "シミュレーターの行: ${device_line}"
          case "${device_line}" in
            *"(Booted)"*)
              echo "すでに起動済みです。"
              ;;
            *)
              xcrun simctl boot "${SIMULATOR_UDID}"
              ;;
          esac
          # 起動完了まで待つ。このコマンドの使い方は未確認（要確認）。
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b

          echo "=== アプリをインストール ==="
          xcrun simctl install "${SIMULATOR_UDID}" "${app_path}"

          echo "=== アプリを起動 ==="
          # -sampleData は UI テストと同じ起動引数。中身はまだ空。
          xcrun simctl launch "${SIMULATOR_UDID}" "${bundle_id}" -sampleData

          echo "=== 数秒待つ ==="
          sleep 5

          echo "=== 画面写真（予備） ==="
          xcrun simctl io booted screenshot screenshots/fallback-launch.png

      # main への push ではテストしないので、この手順も動かさない。
      - name: スクリーンショットの有無をログに出す
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          set -e
          set -o pipefail
          mkdir -p screenshots
          echo "=== screenshots の中身 ==="
          find screenshots -print
          png_count="$(find screenshots -type f -iname '*.png' | wc -l | tr -d '[:space:]')"
          echo "PNG の枚数: ${png_count}"
          if [ -z "${png_count}" ] || [ "${png_count}" = "0" ]; then
            echo "PNGが無い"
          fi

      # actions/upload-artifact の安定版。上の結果ファイルと同じ v7.0.2。
      # テストの成否にかかわらずアップロードする。保存期間は7日。
      # main への push ではテストしないので、この手順も動かさない。
      - name: スクリーンショットをアップロード
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: screenshots/
          retention-days: 7
          if-no-files-found: warn
