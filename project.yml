name: EasyJournal

options:
  # Bundle ID の元。決定済み（仮ではない）。
  # この値だけだと、ターゲット名がそのまま付いて com.junald69.EasyJournal になる。
  # 決定済みの com.junald69.easyjournal にするため、下で完全な値を指定している。
  bundleIdPrefix: com.junald69
  # 最低 iOS バージョン。仮（U-01。安定性重視の仮の値）。
  deploymentTarget:
    iOS: "18.0"

targets:
  EasyJournal:
    type: application
    platform: iOS
    sources:
      - App
      # 保存先などのコード。フォルダが無いと XcodeGen は失敗する。
      - Sources
    settings:
      # 決定済みの Bundle ID。仮ではない。値は変えない。
      # Junさんが確定した値。Apple側に登録できるかは、T-005のあとに確認する。
      # PRODUCT_BUNDLE_IDENTIFIER を書くと、このターゲットでは上の bundleIdPrefix の自動生成は使われない。
      PRODUCT_BUNDLE_IDENTIFIER: com.junald69.easyjournal
      # Swift の言語モード。仮（U-02）。5.0 系。
      SWIFT_VERSION: "5.0"
      # iPhone のみ。1 は iPhone。Xcode の画面で効くかは未確認（要確認）。
      TARGETED_DEVICE_FAMILY: "1"
      # Mac と visionOS の「iPad 向けアプリを動かす」実行先を出さない。効くかは未確認（要確認）。
      SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
      SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    info:
      path: App/Info.plist
      properties:
        # アプリ名。仮。
        CFBundleDisplayName: Easy Journal
        # 起動画面。ストーリーボードは置かない。
        UILaunchScreen: {}
        # 画面の向き。iPhone の一般的な向き（縦、左横、右横）。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # SwiftUI の画面切り替え（シーン）に必要な最小の設定。
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    # アプリに許可する機能の宣言。XcodeGen が path のファイルを作る。手では書かない。
    # 作られたファイルは Git に入れない。中身の元は、下の properties。
    # App Group ID は Sources/Core/Storage/AppGroup.swift と同じにする。どちらかを変えたら、両方変える。
    # Junさんが確定した値。Apple側に登録できるかは、T-005のあとに確認する。
    entitlements:
      path: EasyJournal.entitlements
      properties:
        # 値は必ずリスト（- で始まる行）。文字列1つにしない。
        com.apple.security.application-groups:
          - group.com.junald69.easyjournal

  EasyJournalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Sources/Core はここには入れない。
      # テストはアプリ本体を @testable import EasyJournal して使う。
      # 同じファイルをアプリとテストの両方に入れると、型が二重になることがあるため。
      # この分け方は T-006 から変えていない。設定の値は変えない。
      - Tests/CoreTests
    dependencies:
      # テストの相手はアプリ本体。XcodeGen は、相手がアプリのとき TEST_HOST（テストをアプリの中で動かす設定）を自動で入れる。
      - target: EasyJournal
    settings:
      # 決定済み。アプリの Bundle ID に .tests を付けた形。
      # bundleIdPrefix だけだと com.junald69.EasyJournalTests になるので、完全な値を書く。
      PRODUCT_BUNDLE_IDENTIFIER: com.junald69.easyjournal.tests
      # テスト用の Info.plist をファイルで置かない。Xcode にビルドのとき作らせる。
      # この設定は T-003 から main に入っている。値は変えない。
      GENERATE_INFOPLIST_FILE: YES

  # UIテスト（アプリを起動して画面を確認するテスト）。スクリーンショット用。
  EasyJournalUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      # 起動する相手はアプリ本体。
      # XcodeGen が、UIテストからこのアプリを起動する設定まで入れるかは要確認。
      - target: EasyJournal
    settings:
      # 指定どおりの Bundle ID。
      # bundleIdPrefix だけだと com.junald69.EasyJournalUITests になるので、完全な値を書く。
      PRODUCT_BUNDLE_IDENTIFIER: com.junald69.easyjournal.uitests
      # テスト用の Info.plist をファイルで置かない。Xcode にビルドのとき作らせる。
      # この設定は T-003 から main に入っている。値は変えない。
      GENERATE_INFOPLIST_FILE: YES

# 共有スキーム（xcodebuild -scheme で使う実行設定）。
# shared: true を明示している。共有されるかは、生成後のファイルで確認する（要確認）。
schemes:
  EasyJournal:
    build:
      targets:
        EasyJournal: all
        EasyJournalTests: [test]
        EasyJournalUITests: [test]
    test:
      # xcodebuild test は1回のまま。UIテストもこのスキームに含める。
      targets:
        - EasyJournalTests
        - EasyJournalUITests
    management:
      shared: true
